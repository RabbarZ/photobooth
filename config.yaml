# Photobooth — single source of truth for every setting.
#
# Read by everything (through pbcommon.py). main.py's flags only choose what
# to run; anything you would tune for an event lives here.
#
# After any change, `sudo deploy/deploy.sh` re-renders the hostapd/dnsmasq/
# nginx files and systemd units (needed for `access_point`, `limits`, `portal`)
# and restarts everything. For the rest a restart is enough:
#   booth, screen        sudo systemctl restart photobooth
#   password, gallery    sudo systemctl restart 'photobooth*'

booth:
  # Seconds between pressing the button and the shutter firing. 0 fires
  # immediately.
  countdown_seconds: 5
  # BCM number of the trigger button (GPIO17 is physical pin 11, next to GND on
  # pin 9). null for keyboard only. The keyboard (Enter) always works too.
  gpio_pin: 17
  # Button debounce. On the Pi 5 this is a *minimum hold time*, not a lockout:
  # gpiozero's lgpio backend only reports an edge that has been stable this
  # long. 0.1 would drop every quick tap (40-80 ms). 0.025 clears real contact
  # bounce (a microswitch settles in under 10 ms, a big industrial block in
  # ~20 ms). Raise it only for genuine double-triggers.
  bounce_seconds: 0.025
  # How often to poke the camera while idle. The A7 III sleeps after 30 minutes
  # at most and cannot be set to never sleep, so stay well inside that.
  keepalive_seconds: 120
  # Delete each photo from the camera's card once it is saved on the Pi.
  delete_after_download: false
  # The camera's Quality setting, put back on every connect in case someone
  # changed it on the camera. JPEG only: Standard, Fine or Extra Fine (RAW and
  # RAW+JPEG also exist, but the gallery only shows JPEGs). null leaves the
  # camera's setting alone.
  image_quality: Standard

screen:
  # Under the countdown digit. The lens sits below the screen, and guests stare
  # at the countdown -- so the photos come out with everyone looking slightly
  # too high. The arrows point at the camera even if nobody reads the words.
  # Empty for none.
  camera_hint: "↓ Kamera isch do unde ↓"
  camera_hint_size: 128
  # From the shutter firing until the photo appears. Empty for none.
  capture_message: "Bitte lache!"
  # The camera answers but will not fire: usually a dialog on its own screen.
  not_ready_message: "Kamera nicht bereit - bitte Hinweis an der Kamera bestätigen"
  # No camera at all: switched off or not in PC Remote mode.
  no_camera_message: "Keine Kamera gefunden - bitte Kamera einschalten"
  # Before the first photo of the evening.
  waiting_message: "Warte auf das erste Foto..."

  # The two QR codes down the right edge. Same size on purpose: they are two
  # steps of one instruction, and a smaller second code reads as optional.
  join_qr_caption: "1. WLAN verbinde"
  gallery_qr_caption: "2. Galerie ufmache"
  qr_height: 260
  # Vertical gap between the two plates. Small enough that they read as one
  # instruction, not two offers.
  qr_gap: 200
  # Caption size in pixels. A title, not a footnote: it has to be readable from
  # where people stand, much further away than a phone can scan from.
  qr_caption_size: 42

  # Decode photos at a smaller scale: quicker to appear, slightly softer.
  # Worth turning on for a 4K screen.
  fast_decode: false

access_point:
  ssid: Photobooth
  interface: wlan0
  # 2.4 GHz only. Use 1, 6 or 11 -- they are the only non-overlapping channels,
  # and a crowded channel hurts far more than anything else you can tune here.
  channel: 6
  country_code: CH
  # The onboard radio is a single-antenna BCM4345/6 (CYW43455): 802.11n here on
  # 2.4 GHz, 802.11ac only if moved to 5 GHz, and no 802.11ax/be at all. It
  # degrades badly past a handful of *active* clients, so keep this low.
  # Raising it does not give you more throughput, only more contention.
  max_num_sta: 10
  address: 10.42.0.1
  prefix_length: 24
  dhcp_range_start: 10.42.0.50
  dhcp_range_end: 10.42.0.150
  # Short leases keep the table small as guests come and go.
  dhcp_lease_time: 15m

password:
  # How often a NEW passphrase is minted and the QR redrawn.
  rotate_interval_minutes: 5

  # How many passphrases hostapd accepts at once (a rolling key ring).
  #
  # With one key, a guest who joins moments before a rotation is stranded: the
  # passphrase their phone cached is gone, and any reconnect -- power save,
  # roaming, walking behind a wall -- fails until they rescan. Keeping the
  # last N valid means a scanned code stays usable for roughly
  # N x rotate_interval_minutes, so unlucky timing stops mattering.
  #
  # 1 means a single key, with no overlap. Raising it widens the window in
  # which an already-departed guest could still rejoin on a cached key, so it
  # trades strictness for not stranding people.
  valid_passphrases: 4

  length: 12
  psk_file: /etc/hostapd/photobooth.psk
  # The join QR, rewritten on every rotation; the booth screen shows it.
  qr_path: /var/lib/photobooth/wifi-qr.png
  # Second QR shown beside the join code: it encodes the gallery URL rather
  # than credentials. Android opens the gallery by itself after joining;
  # iPhones get no sign-in sheet, so this code is their way in. Written once at
  # AP bring-up -- the URL only depends on the interface address, so unlike the
  # join QR it never rotates.
  portal_qr_path: /var/lib/photobooth/portal-qr.png
  password_path: /var/lib/photobooth/current-password.txt

# There are deliberately no session limits: deauthenticating a phone does not
# keep it out, it reassociates on its cached passphrase within about a second.
#
# What bounds a guest's session is the key ring above. Every rotation
# deauthenticates everyone so they re-key, and a guest can only come back while
# the passphrase they scanned is still in the ring. That gives a natural cap of
# up to valid_passphrases x rotate_interval_minutes -- 20 minutes as configured
# -- measured from when their code was minted rather than when they scanned it,
# so 15-20 minutes in practice.
#
# The practical consequence: to change how long guests get, change the two
# password settings above. Nothing else caps it.

gallery:
  # Where the booth saves and the gallery serves from. A relative path is
  # relative to the repo root; an absolute path also works.
  photo_dir: photos
  thumb_dir: /var/lib/photobooth/thumbs
  thumb_width: 480
  # App-layer cap: the gallery lists at most this many photos (newest first).
  # nginx serves the files directly, so the app cannot meter per-file
  # downloads -- capping the listing is the enforceable equivalent.
  max_photos_per_user: 50
  # How often ingest.py looks for new photos to make thumbnails of. A look is
  # one directory listing, so this can be short; a new photo's thumbnail
  # appears in the gallery within about this long.
  ingest_poll_seconds: 3

limits:
  # Simultaneous downloads per device. 2 is right for this chip; 3+ makes every
  # transfer slower without finishing sooner.
  per_device_downloads: 2
  # Global cap so the radio is not oversubscribed by several guests at once.
  global_downloads: 6
  portal_rate_per_second: 10
  portal_rate_burst: 20

portal:
  # gunicorn binds here and nginx proxies to it. Both are baked into rendered
  # files (the portal unit and the nginx site), so re-run deploy/setup.sh after
  # changing either.
  bind: 127.0.0.1:8080
  # gunicorn worker processes, each running 4 threads. The page is a directory
  # listing; the radio runs out long before two workers do.
  workers: 2
