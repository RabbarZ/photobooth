# Photobooth gallery — single source of truth for every tunable.
#
# Read by: portal.py, rotate_password.py, ingest.py, setup.sh
# After changing values under `access_point` or `limits`, re-run setup.sh so the
# rendered hostapd/dnsmasq/nginx files pick them up. Everything else is read at
# runtime; a `systemctl restart photobooth-*` is enough.

access_point:
  ssid: Photobooth
  interface: wlan0
  # 2.4 GHz only. Use 1, 6 or 11 -- they are the only non-overlapping channels,
  # and a crowded channel hurts far more than anything else you can tune here.
  channel: 6
  country_code: CH
  # The onboard radio is a single-antenna BCM4345/6 (CYW43455): 802.11n here on
  # 2.4 GHz, 802.11ac only if moved to 5 GHz, and no 802.11ax/be at all. It
  # degrades badly past a handful of *active* clients, so keep this low.
  # Raising it does not give you more throughput, only more contention.
  max_num_sta: 10
  address: 10.42.0.1
  prefix_length: 24
  dhcp_range_start: 10.42.0.50
  dhcp_range_end: 10.42.0.150
  # Short leases keep the table small as guests come and go.
  dhcp_lease_time: 15m

password:
  # How often a NEW passphrase is minted and the QR redrawn.
  rotate_interval_minutes: 5

  # How many passphrases hostapd accepts at once (a rolling key ring).
  #
  # With one key, a guest who joins moments before a rotation is stranded: the
  # passphrase their phone cached is gone, and any reconnect -- power save,
  # roaming, walking behind a wall -- fails until they rescan. Keeping the
  # last N valid means a scanned code stays usable for roughly
  # N x rotate_interval_minutes, so unlucky timing stops mattering.
  #
  # 1 restores the old single-key behaviour. Raising it widens the window in
  # which an already-departed guest could still rejoin on a cached key, so it
  # trades strictness for not stranding people. 3 is a sensible default.
  valid_passphrases: 4

  length: 12
  psk_file: /etc/hostapd/photobooth.psk
  # Fixed paths so the photobooth display can just show the file.
  qr_path: /var/lib/photobooth/wifi-qr.png
  # Second QR shown beside the join code: it encodes the portal URL rather
  # than credentials, so a guest already on the Wi-Fi can reach the gallery
  # without waiting for the captive sheet. Written once at AP bring-up -- the
  # URL only depends on the interface address, so unlike the join QR it never
  # rotates.
  portal_qr_path: /var/lib/photobooth/portal-qr.png
  password_path: /var/lib/photobooth/current-password.txt

# There are deliberately no session limits. There used to be a hard (wall
# clock) and a soft (idle) timer enforced by deauthenticating stations, and
# both were removed because they could not do what they claimed: a deauth
# without key expiry is a one-second inconvenience -- a phone reassociates on
# its cached passphrase almost immediately, which was measured, not assumed.
#
# What actually bounds a guest's session is the key ring above. Every rotation
# deauthenticates everyone so they re-key, and a guest can only come back while
# the passphrase they scanned is still in the ring. That gives a natural cap of
# up to valid_passphrases x rotate_interval_minutes -- 30 minutes as configured
# -- measured from when their code was minted rather than when they scanned it,
# so 20-30 minutes in practice.
#
# The practical consequence: to change how long guests get, change the two
# password settings above. Nothing else caps it.

gallery:
  photo_dir: /home/pi/repos/photobooth/photos
  thumb_dir: /var/lib/photobooth/thumbs
  zip_path: /var/lib/photobooth/all-photos.zip
  thumb_width: 480
  # App-layer cap: the gallery lists at most this many photos (newest first).
  # nginx serves the files directly, so the app cannot meter per-file
  # downloads -- capping the listing is the enforceable equivalent.
  max_photos_per_user: 50
  # Wait for the directory to stop changing before rebuilding the zip, so a
  # burst of shots produces one rebuild rather than one per photo.
  ingest_debounce_seconds: 5
  ingest_poll_seconds: 10

limits:
  # Simultaneous downloads per device. 2 is right for this chip; 3+ makes every
  # transfer slower without finishing sooner.
  per_device_downloads: 2
  # Global cap so the radio is not oversubscribed by several guests at once.
  global_downloads: 6
  portal_rate_per_second: 10
  portal_rate_burst: 20

portal:
  # gunicorn binds here; nginx proxies to it. Two workers is the ceiling worth
  # using on 1 GB -- see README, RAM is the binding constraint on this box.
  bind: 127.0.0.1:8080
  workers: 2
  # /run/photobooth still exists on tmpfs -- main.py writes its runtime
  # overrides there -- but the portal no longer keeps a database of its own,
  # so there is nothing here to point at.
