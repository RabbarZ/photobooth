<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth</title>
<link rel="stylesheet" href="/static/portal.css">
</head>
<body>

<header>
  <h1>Photobooth</h1>
  <p class="sub">Zum Speichern auf ein Foto tippen. {{ photos|length }} Foto{{ '' if photos|length == 1 else 's' }} verf&uuml;gbar.</p>
</header>

{% if photos %}
<main class="grid">
  {% for photo in photos %}
  <a class="tile" href="/photos/{{ photo.name }}" download="{{ photo.name }}">
    <img src="/thumbs/{{ photo.name }}" alt="{{ photo.name }}" loading="lazy" decoding="async">
  </a>
  {% endfor %}
</main>
{% else %}
<main class="empty"><p>Noch keine Fotos. Bitte l&auml;cheln!</p></main>
{% endif %}

<footer><p>Mit der Fotobox verbunden. Hier gibt es kein Internet.</p></footer>
</body>
</html>
