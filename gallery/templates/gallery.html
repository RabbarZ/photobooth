<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth</title>
<link rel="stylesheet" href="/static/portal.css">
</head>
<body>

<header>
  <h1>Photobooth</h1>
  <p class="sub">Zum Speichern auf ein Foto tippen. {{ photos|length }} Foto{{ '' if photos|length == 1 else 's' }} verf&uuml;gbar.</p>
</header>

{% if photos %}
<main class="grid">
  {% for photo in photos %}
  <a class="tile" href="/photos/{{ photo.name }}" download="{{ photo.name }}">
    <img src="/thumbs/{{ photo.name }}" alt="{{ photo.name }}" loading="lazy" decoding="async">
  </a>
  {% endfor %}
</main>
{% else %}
<main class="empty"><p>Noch keine Fotos. Bitte l&auml;cheln!</p></main>
{% endif %}

<footer><p>Mit der Fotobox verbunden. Hier gibt es kein Internet.</p></footer>

<script>
// Heartbeat: resets the server's idle timer while this page is open. Errors are
// ignored on purpose -- a failed beat must never break the gallery.
const BEAT_MS = {{ heartbeat_seconds }} * 1000;
function beat() {
  fetch('/api/heartbeat', {method: 'POST', cache: 'no-store'}).catch(() => {});
}
setInterval(beat, BEAT_MS);
// Beat again when the phone wakes and the tab becomes visible, so a returning
// guest is not sitting on an already-expired idle timer.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) beat();
});
</script>
</body>
</html>
